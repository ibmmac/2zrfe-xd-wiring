  <rect x="40" y="50" width="420" height="160" rx="10" fill="#fff" stroke="#2E5A6C" stroke-width="2"/>
  <text x="56" y="74" font-family="Georgia, serif" font-size="12" fill="#5A6B72">Upper connector (looking into wire side)</text>
  <rect x="70" y="100" width="50" height="50" rx="4" fill="#eee" stroke="#888"/>
  <text x="82" y="130" font-family="Georgia, serif" font-size="11" fill="#555">8</text>
  <rect x="140" y="100" width="50" height="50" rx="4" fill="#F4E4D4" stroke="#C45C26" stroke-width="3"/>
  <text x="152" y="122" font-family="Georgia, serif" font-size="11" fill="#C45C26">9</text>
  <text x="146" y="138" font-family="Georgia, serif" font-size="11" fill="#C45C26">ADD</text>
