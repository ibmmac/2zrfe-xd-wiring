  <text x="216" y="138" font-family="Georgia, serif" font-size="10" fill="#9fd">BLUE</text>
  <rect x="280" y="100" width="50" height="50" rx="4" fill="#eee" stroke="#888"/>
  <text x="292" y="130" font-family="Georgia, serif" font-size="11" fill="#555">11</text>
  <text x="140" y="172" font-family="Georgia, serif" font-size="11" fill="#C45C26">empty = new ground</text>
  <text x="210" y="188" font-family="Georgia, serif" font-size="11" fill="#2E5A6C">do NOT cut</text>
  <rect x="490" y="50" width="250" height="160" rx="8" fill="#1B3A4B"/>
  <text x="506" y="78" font-family="Georgia, serif" font-size="13" fill="#fff">Ground the NEW wire</text>
